[package]
name = "spotifast-android"
version = "0.12.0"
edition = "2024"
license = "MIT"
description = "Native Android librespot audio engine for Spotifast"

[lib]
name = "spotifast_jni"
crate-type = ["cdylib"]

[dependencies]
jni = { version = "0.21", features = ["invocation"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
android_logger = "0.14"
anyhow = "1.0"
parking_lot = "0.12"

# Librespot core and playback
# Using git revisions or crates matching spotifast desktop
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "18e47458117eb9eafe0972b9a764dca6e1a429b5" }
librespot-playback = { git = "https://github.com/librespot-org/librespot", rev = "18e47458117eb9eafe0972b9a764dca6e1a429b5" }
librespot-metadata = { git = "https://github.com/librespot-org/librespot", rev = "18e47458117eb9eafe0972b9a764dca6e1a429b5" }
librespot-protocol = { git = "https://github.com/librespot-org/librespot", rev = "18e47458117eb9eafe0972b9a764dca6e1a429b5" }
protobuf = "3"
